<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldGuard - Live Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f4f6f8; 
            color: #333;
            margin: 0;
            padding: 40px; 
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        
        /* Header Section */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-bottom: 20px; 
            border-bottom: 1px solid #eaeaea; 
        }
        
        h1 { 
            margin: 0; 
            color: #111827; 
            font-size: 28px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        small {
            color: #6b7280;
            font-size: 14px;
            font-weight: 400;
        }

        /* Status Badge (Online/Offline) */
        .status-badge { 
            padding: 8px 16px; 
            border-radius: 50px; 
            font-size: 13px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
        }
        .status-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background-color: white;
        }
        .online { background-color: #10b981; color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .offline { background-color: #ef4444; color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }

        /* Table Styling */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            margin-top: 20px; 
        }
        
        th { 
            background-color: #f9fafb; 
            color: #4b5563; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            text-align: left; 
            padding: 16px; 
            border-bottom: 2px solid #e5e7eb;
        }
        
        td { 
            padding: 16px; 
            border-bottom: 1px solid #f3f4f6; 
            font-size: 15px;
            vertical-align: middle;
        }
        
        tr:last-child td { border-bottom: none; }
        
        /* Row Highlighting & Hover */
        tr:hover td { background-color: #f9fafb; }
        
        .row-critical { 
            background-color: #fef2f2 !important; /* Light Red Background */
        }
        .row-critical td:first-child {
            border-left: 4px solid #ef4444; /* Red Stripe on left */
        }

        /* Severity Pill Badge */
        .severity-badge {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Alert ID Number */
        .animal-id {
            background-color: #eef2ff;
            color: #4f46e5;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-family: monospace;
            font-size: 14px;
        }

        /* Empty State */
        .no-data { 
            text-align: center; 
            color: #9ca3af; 
            padding: 40px; 
            font-style: italic; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>🚜 FieldGuard Dashboard</h1>
            <small>Real-time Livestock Health Monitoring</small>
        </div>
        <span id="connection-status" class="status-badge offline">Backend Offline</span>
    </div>

    <h3 style="font-size: 18px; color: #374151; margin-bottom: 10px;">Recent Health Alerts</h3>
    
    <table id="alerts-table">
        <thead>
            <tr>
                <th width="15%">Time</th>
                <th width="15%">Animal ID</th>
                <th width="15%">Severity</th>
                <th width="15%">Temperature</th>
                <th width="40%">Message</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="5" class="no-data">Waiting for data stream...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API_URL = "http://localhost:8080/api/alerts";

    async function fetchAlerts() {
        try {
            const response = await fetch(API_URL);
            
            if (!response.ok) throw new Error("Failed to connect");

            // Success: Update Badge
            const statusBadge = document.getElementById("connection-status");
            statusBadge.innerHTML = "System Online";
            statusBadge.className = "status-badge online";

            const alerts = await response.json();
            updateTable(alerts);

        } catch (error) {
            console.error("Connection Error:", error);
            // Error: Update Badge
            const statusBadge = document.getElementById("connection-status");
            statusBadge.innerHTML = "Backend Offline";
            statusBadge.className = "status-badge offline";
        }
    }

    function updateTable(alerts) {
        const tbody = document.getElementById("table-body");
        
        if (alerts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="no-data">No active alerts. Herd is healthy.</td></tr>';
            return;
        }

        tbody.innerHTML = ""; // Clear existing rows

        // Sort: Newest alerts on top
        alerts.reverse();

        alerts.forEach(alert => {
            const row = document.createElement("tr");
            
            // Highlight critical rows
            if (alert.severity === 'CRITICAL') {
                row.classList.add('row-critical');
            }

            // Format timestamp 
            const dateObj = new Date(alert.timestamp);
            const timeString = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // CLEANUP: Remove redundant temp from message
            // "Fever detected: 40.9°C" -> "Fever detected"
            let cleanMessage = alert.description;
            if(cleanMessage.includes(":")) {
                cleanMessage = cleanMessage.split(":")[0];
            }

            row.innerHTML = `
                <td style="color: #6b7280; font-variant-numeric: tabular-nums;">${timeString}</td>
                <td><span class="animal-id">#${alert.animalId}</span></td>
                <td><span class="severity-badge">${alert.severity}</span></td>
                <td style="font-weight: 600;">${alert.temperature.toFixed(1)} °C</td>
                <td>${cleanMessage}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Auto-refresh every 2 seconds
    setInterval(fetchAlerts, 2000);
    
    // Run immediately on load
    fetchAlerts();
</script>

</body>
</html>
